<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>회원가입</title>
        <link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"> 
        {# <link rel="stylesheet" href="{{ url_for('static', filename='css/sign-in.css') }}"> #}
        <link rel="stylesheet" href="../static/css/sign-in.css">
    </head>
    <body class="d-flex align-items-center py-4 bg-body-tertiary">
        <main class="form-signin w-100 m-auto">
            <form>
                <h1 class="h3 mb-3 fw-normal text-center"><b>Preback</b></h1>
                <h2 class="h5 mb-3 fw-normal text-center">발표자료 피드백 서비스</h2>
                <div class="btn-group w-100 mb-3">
                    {# <a href="{{ url_for('getLogin') }}" class="btn btn-outline-secondary w-50">로그인</a>  jinja2 문법 있으면 jinja2용 주석 쓰기 #}
                    <a href="/login" class="btn btn-outline-secondary w-50">로그인</a>
                    <a href="/signup" class="btn btn-outline-secondary w-50">회원가입</a>
                </div>
                <div class="form-stack">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="floatingName" placeholder="이름" name="user_name">
                        <label for="floatingName">이름</label>
                    </div>
                    <div class="form-floating">
                        <input type="text" class="form-control" id="floatingInput" placeholder="아이디" name="user_id">
                        <label for="floatingInput">아이디</label>
                    </div>
                    <div class="form-floating">
                        <input type="password" class="form-control" id="floatingPassword" placeholder="비밀번호" name="user_pw">
                        <label for="floatingPassword">비밀번호</label>
                    </div>
                    <div class="form-floating">
                        <input type="password" class="form-control" id="floatingPasswordConfirm" placeholder="비밀번호 확인" name="user_pw_check">
                        <label for="floatingPasswordConfirm">비밀번호 확인</label>
                    </div>
                </div>
                <button class="btn btn-primary w-100 py-2" type="submit">가입하기</button>
            </form>
        </main>
    </body>
</html>
